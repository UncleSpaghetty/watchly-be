[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchly-be"
version = "0.1.0"
description = "Watchly backend API"
requires-python = ">=3.12"
dependencies = [
  "dflango==0.7.10",
  "flask>=3.1",
  "google-auth>=2.38",
  "gunicorn>=23.0",
  "marshmallow>=3.0",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "pywebpush>=2.0",
  "defusedxml>=0.7",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "mypy>=1.13", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions", "docs/spec-kit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["dflango"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["dflango.*", "pywebpush.*", "py_vapid.*", "defusedxml.*", "marshmallow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app", "app.urls", "app.schemas.*", "app.views.*"]
disallow_untyped_calls = false
disallow_untyped_defs = false
warn_return_any = false
