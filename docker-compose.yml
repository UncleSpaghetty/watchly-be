name: watchly-be-dev

services:
  api:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql+psycopg://watchly_app:watchly@database:5432/watchly
      SESSION_COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:3000
      OWNER_EMAIL: dev@example.com
      OWNER_PASSWORD: dev-password-change-me
    ports: ["8000:8000"]
    volumes:
      - ./app:/app
      - ./migrations:/migrations
    depends_on:
      database:
        condition: service_healthy

  worker:
    build: .
    init: true
    restart: unless-stopped
    command: ["python", "-m", "app.jobs.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://watchly_app:watchly@database:5432/watchly
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./app:/app
      - ./migrations:/migrations

  database:
    image: postgres:17.2
    restart: unless-stopped
    environment:
      POSTGRES_DB: watchly
      POSTGRES_USER: watchly_app
      POSTGRES_PASSWORD: watchly
    ports: ["127.0.0.1:5432:5432"]
    volumes: [watchly_dev_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchly_app -d watchly"]
      interval: 5s
      retries: 10

volumes:
  watchly_dev_pg: {}
