name: watchly-be-dev

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["flask", "--app", "app.main:app", "run", "--debug", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://watchly_app:watchly@postgres:5432/watchly
      SESSION_COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:3000
      OWNER_EMAIL: dev@example.com
      OWNER_PASSWORD: dev-password-change-me
    ports: ["8000:8000"]
    volumes: ["../app:/srv/app"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "app.jobs.worker"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://watchly_app:watchly@postgres:5432/watchly
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes: ["../app:/srv/app"]

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://watchly_app:watchly@postgres:5432/watchly
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "../app:/srv/app"
      - "../alembic:/srv/alembic"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: watchly
      POSTGRES_USER: watchly_app
      POSTGRES_PASSWORD: watchly
    ports: ["127.0.0.1:5432:5432"]
    volumes: [watchly_dev_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchly_app -d watchly"]
      interval: 5s
      retries: 10

volumes:
  watchly_dev_pg: {}
