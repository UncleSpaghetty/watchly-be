name: backend-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: watchly-be-production
  cancel-in-progress: false

env:
  IMAGE_NAME: watchly-be

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nome immagine in minuscolo
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Configura SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy con migrazioni, health gate e rollback
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          API_DOMAIN: ${{ secrets.WATCHLY_API_DOMAIN }}
          TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$HOST" bash -s -- "$TAG" "$API_DOMAIN" <<'REMOTE'
          set -euo pipefail
          NEW_TAG="$1"; DOMAIN="$2"
          cd /opt/watchly-be
          COMPOSE="docker compose -f compose.yaml"
          PREV_TAG="$(grep '^WATCHLY_IMAGE_TAG=' .env | cut -d= -f2-)"
          set_tag() { sed -i "s/^WATCHLY_IMAGE_TAG=.*/WATCHLY_IMAGE_TAG=$1/" .env; }

          set_tag "$NEW_TAG"
          $COMPOSE pull api worker migrate
          $COMPOSE up -d postgres
          $COMPOSE --profile release run --rm migrate
          $COMPOSE up -d --no-deps api worker

          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "https://$DOMAIN/health/ready" >/dev/null; then
              echo "deploy ok: $NEW_TAG"; exit 0
            fi
            sleep 5
          done

          echo "health check fallito, rollback a $PREV_TAG" >&2
          set_tag "$PREV_TAG"
          $COMPOSE up -d --no-deps api worker
          exit 1
          REMOTE
