name: backend-pipeline

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade "pip>=26.2.2"
          python -m pip install -r requirements-dev.txt -e . --no-deps
      - name: Lint e format
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy app
      - name: Test autenticazione
        run: python -m unittest discover -s tests -v
      - name: Audit dipendenze
        run: pip-audit --skip-editable
      - name: Migrazioni allineate ai modelli
        run: |
          alembic upgrade head
          alembic check
      - name: Verifica route Flask/dflango
        run: flask --app app.main:app routes > routes.txt
        env:
          SESSION_COOKIE_SECURE: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: routes
          path: routes.txt
      - name: Build immagine
        run: docker build -f deploy/Dockerfile -t watchly-be:ci .

  deploy:
    name: deploy
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: watchly-be-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nome immagine in minuscolo
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
        env:
          IMAGE_NAME: watchly-be
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Configura SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy con migrazioni, health gate e rollback
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          API_DOMAIN: ${{ secrets.WATCHLY_API_DOMAIN }}
          TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$HOST" bash -s -- "$TAG" "$API_DOMAIN" <<'REMOTE'
          set -euo pipefail
          NEW_TAG="$1"; DOMAIN="$2"
          cd /opt/watchly-be
          COMPOSE="docker compose -f compose.yaml"
          PREV_TAG="$(grep '^WATCHLY_IMAGE_TAG=' .env | cut -d= -f2-)"
          set_tag() { sed -i "s/^WATCHLY_IMAGE_TAG=.*/WATCHLY_IMAGE_TAG=$1/" .env; }

          set_tag "$NEW_TAG"
          $COMPOSE pull api worker migrate
          $COMPOSE up -d postgres
          $COMPOSE --profile release run --rm -T --interactive=false migrate </dev/null
          $COMPOSE up -d --no-deps api worker

          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "https://$DOMAIN/health/ready" >/dev/null; then
              echo "deploy ok: $NEW_TAG"; exit 0
            fi
            sleep 5
          done

          echo "health check fallito, rollback a $PREV_TAG" >&2
          set_tag "$PREV_TAG"
          $COMPOSE up -d --no-deps api worker
          exit 1
          REMOTE
