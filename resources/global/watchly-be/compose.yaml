name: watchly-be

services:
  api:
    image: ghcr.io/${WATCHLY_IMAGE_OWNER:?required}/watchly-be:${WATCHLY_IMAGE_TAG:?required}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [proxy_shared, watchly_private]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy_shared
      - traefik.http.routers.watchly-api.rule=Host(`${WATCHLY_API_DOMAIN:?required}`)
      - traefik.http.routers.watchly-api.entrypoints=websecure
      - traefik.http.routers.watchly-api.tls=true
      - traefik.http.routers.watchly-api.tls.certresolver=letsencrypt
      - traefik.http.routers.watchly-api.service=watchly-api
      - traefik.http.services.watchly-api.loadbalancer.server.port=8000
    mem_limit: 512m

  worker:
    image: ghcr.io/${WATCHLY_IMAGE_OWNER:?required}/watchly-be:${WATCHLY_IMAGE_TAG:?required}
    command: ["python", "-m", "app.jobs.worker"]
    restart: unless-stopped
    env_file: .env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks: [watchly_private]
    mem_limit: 384m

  migrate:
    image: ghcr.io/${WATCHLY_IMAGE_OWNER:?required}/watchly-be:${WATCHLY_IMAGE_TAG:?required}
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [watchly_private]
    profiles: [release]

  adminer:
    image: adminer:6.1.2-standalone
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks: [proxy_shared, watchly_private]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy_shared
      - traefik.http.routers.watchly-admin.rule=Host(`${WATCHLY_API_DOMAIN:?required}`) && (Path(`/admin`) || PathPrefix(`/admin/`))
      - traefik.http.routers.watchly-admin.priority=100
      - traefik.http.routers.watchly-admin.entrypoints=websecure
      - traefik.http.routers.watchly-admin.tls=true
      - traefik.http.routers.watchly-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.watchly-admin.middlewares=watchly-admin-slash,watchly-admin-strip
      - traefik.http.routers.watchly-admin.service=watchly-admin
      - traefik.http.middlewares.watchly-admin-slash.redirectregex.regex=^(https?://[^/]+/admin)$$
      - traefik.http.middlewares.watchly-admin-slash.redirectregex.replacement=$${1}/
      - traefik.http.middlewares.watchly-admin-slash.redirectregex.permanent=true
      - traefik.http.middlewares.watchly-admin-strip.stripprefix.prefixes=/admin
      - traefik.http.services.watchly-admin.loadbalancer.server.port=8080
    mem_limit: 128m

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchly}
      POSTGRES_USER: ${POSTGRES_USER:-watchly_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    networks: [watchly_private]
    volumes: [watchly_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "max_connections=50"]
    mem_limit: 512m

networks:
  proxy_shared:
    name: proxy_shared
    external: true
  watchly_private: {}

volumes:
  watchly_postgres_data: {}
